name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.2'

jobs:
  linux:
    name: Linux AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libjsoncpp-dev libsecret-1-dev \
            libkeybinder-3.0-dev libayatana-appindicator3-dev libnotify-dev \
            libwebkit2gtk-4.1-dev python3-pip unzip
      - name: Set up Flutter
        shell: bash
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Build tarball + AppImage
        run: bash app/scripts/build_release_linux.sh --appimage
      - name: Upload artifacts to Action summary
        uses: actions/upload-artifact@v4
        with:
          name: relic-linux
          path: |
            dist/*.AppImage
            dist/*.tar.gz
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            dist/*.AppImage
            dist/*.tar.gz

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Rust & Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
      - name: Set up Flutter
        shell: bash
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Build APK
        run: |
          cd app
          flutter pub get
          flutter build apk --release
          TAG_NAME="${{ inputs.tag_name || github.ref_name }}"
          [ -z "$TAG_NAME" ] && TAG_NAME="latest"
          cp build/app/outputs/flutter-apk/app-release.apk "relic-${TAG_NAME}-android.apk"
      - name: Upload artifact to Action summary
        uses: actions/upload-artifact@v4
        with:
          name: relic-android
          path: app/relic-*-android.apk
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          draft: false
          generate_release_notes: true
          files: app/relic-*-android.apk

  ios:
    name: iOS Unsigned IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trust ONNX Runtime download server
        run: |
          echo -n | openssl s_client -connect download.onnxruntime.ai:443 -servername download.onnxruntime.ai 2>/dev/null | openssl x509 > /tmp/onnxruntime.crt || true
          if [ -s /tmp/onnxruntime.crt ]; then
            sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain /tmp/onnxruntime.crt || true
          fi
      - name: Set up Rust & iOS targets
        run: |
          rustup target add aarch64-apple-ios
      - name: Set up Flutter
        shell: bash
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Build iOS unsigned
        run: |
          cd app
          flutter pub get
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          TAG_NAME="${{ inputs.tag_name || github.ref_name }}"
          [ -z "$TAG_NAME" ] && TAG_NAME="latest"
          zip -r "../../../relic-${TAG_NAME}-ios-unsigned.ipa" Payload
      - name: Upload artifact to Action summary
        uses: actions/upload-artifact@v4
        with:
          name: relic-ios
          path: app/relic-*-ios-unsigned.ipa
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          draft: false
          generate_release_notes: true
          files: app/relic-*-ios-unsigned.ipa
